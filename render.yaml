services:
  - type: web
    name: linuxcv-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies, and the build needs typescript and the @types packages.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard (marked sync:false so they are never committed)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # Generated once and kept: rotating it orphans every hash already stored.
      - key: IP_HASH_SALT
        generateValue: true
